name: capture-godot-uids

on:
  push:
    branches:
      - main
    paths:
      - .github/UID_CAPTURE_TRIGGER
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-extract
          mv /tmp/godot-extract/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import project and capture generated files
        run: |
          set -o pipefail
          godot --headless --path game --import 2>&1 | tee /tmp/godot-import.log
          mkdir -p /tmp/godot-generated
          git status --porcelain > /tmp/godot-generated/git-status.txt
          git diff > /tmp/godot-generated/tracked.diff
          git ls-files --others --exclude-standard | grep -E '\.gd\.uid$' > /tmp/missing-uids.txt || true
          cp /tmp/missing-uids.txt /tmp/godot-generated/missing-uids.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "/tmp/godot-generated/$(dirname "$file")"
            cp "$file" "/tmp/godot-generated/$file"
          done < /tmp/missing-uids.txt

      - name: Upload generated UID diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: godot-generated-uids
          path: /tmp/godot-generated
          if-no-files-found: error
